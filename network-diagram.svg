<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1470" viewBox="0 0 1120 1470" role="img" aria-labelledby="title description">
  <title id="title">OpenWrt network with shaped and unrestricted internet paths</title>
  <desc id="description">Generic logical overview of the playbook: LAN, IoT and routed VPN internet traffic use CAKE; unrestricted traffic bypasses CAKE. Both paths use the WAN firewall. Access point coverage is deployment-dependent; no device inventory or physical topology is shown.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b43; }
      .title { font-size: 26px; font-weight: 700; }
      .heading { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #465b72; }
      .white { fill: #fff; }
      .panel { fill: #fff; stroke: #ced8e3; stroke-width: 1.5; }
      .shape { fill: #eaf2ff; stroke: #3670b7; stroke-width: 2; }
      .bypass { fill: #e9f7ef; stroke: #248556; stroke-width: 2; }
      .blue-line { fill: none; stroke: #3670b7; stroke-width: 3; }
      .green-line { fill: none; stroke: #248556; stroke-width: 3; }
      .wire { fill: none; stroke: #718398; stroke-width: 2; }
    </style>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3670b7"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#248556"/></marker>
  </defs>

  <rect width="1120" height="1470" rx="16" fill="#f4f7fb"/>
  <text x="560" y="42" text-anchor="middle" class="title">OpenWrt network</text>
  <text x="560" y="68" text-anchor="middle" class="body">Generic logical overview · Deployment-defined devices and addressing</text>

  <!-- Logical internet paths, in both directions. -->
  <rect x="425" y="94" width="270" height="66" rx="30" fill="#172b43"/>
  <text x="560" y="121" text-anchor="middle" class="heading white">Internet / ISP</text>
  <text x="560" y="144" text-anchor="middle" class="small white">WAN connection</text>
  <path d="M 560 160 V 320" class="wire"/>

  <!-- VPN services terminate at the gateway; these are not unrestricted paths. -->
  <rect x="30" y="94" width="235" height="166" rx="12" class="shape"/>
  <text x="147" y="121" text-anchor="middle" class="heading">WireGuard VPN</text>
  <text x="147" y="148" text-anchor="middle" class="body">Remote VPN clients</text>
  <text x="147" y="174" text-anchor="middle" class="small">Encrypted UDP tunnel</text>
  <text x="147" y="198" text-anchor="middle" class="small">Client QR-code setup</text>
  <text x="147" y="224" text-anchor="middle" class="small">Routed WAN traffic uses CAKE</text>
  <path d="M 147 265 V 365 H 280" class="blue-line" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <rect x="855" y="94" width="235" height="166" rx="12" class="shape"/>
  <text x="972" y="121" text-anchor="middle" class="heading">Tailscale VPN</text>
  <text x="972" y="148" text-anchor="middle" class="body">Optional subnet router</text>
  <text x="972" y="174" text-anchor="middle" class="small">Remote tailnet clients ↔ LAN</text>
  <text x="972" y="198" text-anchor="middle" class="small">Approved routes + tailnet policy</text>
  <text x="972" y="224" text-anchor="middle" class="small">Disabled by default</text>
  <path d="M 972 265 V 365 H 840" class="blue-line" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>

  <g transform="translate(0 130)">
  <rect x="285" y="190" width="550" height="90" rx="12" fill="#234f7f"/>
  <text x="560" y="219" text-anchor="middle" class="heading white">OpenWrt gateway</text>
  <text x="560" y="244" text-anchor="middle" class="body white">Existing WAN firewall + IPv4 NAT</text>
  <text x="560" y="266" text-anchor="middle" class="small white">Unsolicited inbound blocked; existing exceptions retained</text>

  <path d="M 410 280 V 302 H 330 V 325" class="blue-line" marker-end="url(#blue-arrow)"/>
  <path d="M 710 280 V 302 H 900 V 325" class="green-line" marker-end="url(#green-arrow)"/>
  <rect x="95" y="325" width="470" height="106" rx="12" class="shape"/>
  <text x="330" y="355" text-anchor="middle" class="heading">CAKE autorate / SQM</text>
  <text x="330" y="380" text-anchor="middle" class="body">Shared upload and download limits</text>
  <text x="330" y="403" text-anchor="middle" class="small">LAN + IoT + routed VPN internet traffic</text>
  <text x="330" y="422" text-anchor="middle" class="small">ifb-cake-ul / ifb-cake-dl</text>
  <rect x="725" y="325" width="350" height="106" rx="12" class="bypass"/>
  <text x="900" y="355" text-anchor="middle" class="heading">Unrestricted path</text>
  <text x="900" y="382" text-anchor="middle" class="body">Bypasses both CAKE queues</text>

  <path d="M 330 431 V 450 H 200 V 475" class="blue-line" marker-end="url(#blue-arrow)"/>
  <path d="M 330 450 H 550 V 475" class="blue-line" marker-end="url(#blue-arrow)"/>
  <path d="M 900 431 V 475" class="green-line" marker-end="url(#green-arrow)"/>
  <rect x="45" y="475" width="310" height="116" rx="10" class="shape"/>
  <text x="200" y="504" text-anchor="middle" class="heading">Main LAN</text>
  <text x="200" y="530" text-anchor="middle" class="body">Configured LAN subnet</text>
  <text x="200" y="554" text-anchor="middle" class="small">Configured gateway · Native LAN</text>
  <text x="200" y="576" text-anchor="middle" class="small">Main Wi-Fi SSID + wired clients</text>
  <rect x="395" y="475" width="310" height="116" rx="10" class="shape"/>
  <text x="550" y="504" text-anchor="middle" class="heading">IoT network</text>
  <text x="550" y="530" text-anchor="middle" class="body">Configured IoT subnet</text>
  <text x="550" y="554" text-anchor="middle" class="small">Configured gateway · Tagged IoT VLAN</text>
  <text x="550" y="576" text-anchor="middle" class="small">Separate IoT Wi-Fi SSID</text>
  <rect x="745" y="475" width="310" height="116" rx="10" class="bypass"/>
  <text x="900" y="504" text-anchor="middle" class="heading">Unrestricted</text>
  <text x="900" y="530" text-anchor="middle" class="body">Configured unrestricted subnet</text>
  <text x="900" y="554" text-anchor="middle" class="small">Configured gateway · Tagged Unrestricted VLAN</text>
  <text x="900" y="576" text-anchor="middle" class="small">Separate unrestricted Wi-Fi SSID</text>

  <!-- Generic coverage description; deliberately omits device inventory. -->
  <rect x="45" y="619" width="1010" height="166" rx="12" class="panel"/>
  <text x="550" y="646" text-anchor="middle" class="heading">Access points</text>
  <text x="550" y="670" text-anchor="middle" class="small">Native LAN + configured tagged networks · Fast roaming</text>
  <rect x="90" y="689" width="280" height="61" rx="8" fill="#f0f4f9"/>
  <text x="230" y="725" text-anchor="middle" class="body">AP A</text>
  <rect x="410" y="689" width="280" height="61" rx="8" fill="#f0f4f9"/>
  <text x="550" y="725" text-anchor="middle" class="body">AP B</text>
  <rect x="730" y="689" width="280" height="61" rx="8" fill="#f0f4f9"/>
  <text x="870" y="725" text-anchor="middle" class="body">AP C</text>

  <rect x="45" y="810" width="1010" height="155" rx="12" class="panel"/>
  <text x="70" y="839" class="heading">Access between networks</text>
  <text x="70" y="867" class="body">LAN ↔ Unrestricted: connections allowed in both directions</text>
  <text x="70" y="893" class="body">LAN + Unrestricted → IoT: allowed; replies are allowed</text>
  <text x="70" y="919" class="body">IoT → LAN or Unrestricted: new connections blocked</text>
  <text x="70" y="947" class="small">Local routed transfers bypass CAKE. Unrestricted internet traffic can still consume shared ISP capacity.</text>

  <rect x="45" y="990" width="1010" height="310" rx="12" class="panel"/>
  <text x="70" y="1020" class="heading">Network services and management</text>
  <text x="70" y="1051" class="body">Addressing and DNS</text>
  <text x="70" y="1075" class="small">Gateway DHCP/DNS for IoT and unrestricted clients</text>
  <text x="70" y="1097" class="small">Configurable WAN DNS · APs bridge client networks</text>
  <text x="590" y="1051" class="body">Dynamic DNS</text>
  <text x="590" y="1075" class="small">No-IP / FreeDNS (Afraid) hostname updates</text>
  <text x="590" y="1097" class="small">Public endpoint discovery for remote access</text>
  <text x="70" y="1131" class="body">Wi-Fi and isolation</text>
  <text x="70" y="1155" class="small">Separate LAN, IoT and unrestricted SSIDs · 802.11r/k/v</text>
  <text x="70" y="1177" class="small">Optional strict IoT peer isolation · Tagged VLAN trunks</text>
  <text x="590" y="1131" class="body">Monitoring and diagnostics</text>
  <text x="590" y="1155" class="small">Prometheus device + CAKE autorate metrics</text>
  <text x="590" y="1177" class="small">iperf3 server · Optional remote syslog</text>
  <text x="70" y="1211" class="body">Provisioning and recovery</text>
  <text x="70" y="1235" class="small">SSH reachability checks · Configuration backups</text>
  <text x="70" y="1257" class="small">Timed automatic rollback · Post-deployment verification</text>
  <text x="590" y="1211" class="body">Device configuration</text>
  <text x="590" y="1235" class="small">Inventory-defined hostnames, timezone and Wi-Fi country</text>
  <text x="590" y="1257" class="small">DSA and legacy swconfig VLAN support</text>
  </g>
</svg>
