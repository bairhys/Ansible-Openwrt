---
- name: Enable color for 'ls' command
  community.openwrt.lineinfile:
    path: /etc/profile
    line: "alias ls='ls --color=auto'"
    insertafter: EOF
    state: present

- name: Set colored PS1 prompt (Green User, Blue Path)
  community.openwrt.lineinfile:
    path: /etc/profile
    # This matches any existing export PS1 line and replaces it
    regexp: '^export PS1='
    line: "export PS1='\\[\\e[32m\\]\\u@\\h\\[\\e[0m\\]:\\[\\e[34m\\]\\w\\[\\e[0m\\]\\$ '"
    state: present

- name: Configure Hostname
  community.openwrt.uci:
    command: set
    key: system.@system[0].hostname
    value: "{{ inventory_hostname }}"
    autocommit: true
  register: hostname_change

- name: Set zone name from inventory
  community.openwrt.uci:
    command: set
    key: system.@system[0].zonename
    value: "{{ timezone_zonename }}"
    autocommit: true
  register: tz_zone_change

- name: Set timezone from inventory
  community.openwrt.uci:
    command: set
    key: system.@system[0].timezone
    value: "{{ timezone_string }}"
    autocommit: true
  register: tz_change

- name: Forward logs to remote syslog server
  community.openwrt.uci:
    command: batch
    autocommit: true
    value: |
      set system.@system[0].log_ip={{ syslog_server }}
      set system.@system[0].log_port={{ syslog_port | default('514') }}
      set system.@system[0].log_proto={{ syslog_proto | default('udp') }}
      set system.@system[0].log_prefix={{ inventory_hostname }}
  when: (syslog_server | default('')) | length > 0
  register: syslog_change

- name: Stop forwarding logs when no syslog server is set
  community.openwrt.uci:
    command: batch
    autocommit: true
    value: |
      delete system.@system[0].log_ip
      delete system.@system[0].log_port
      delete system.@system[0].log_proto
      delete system.@system[0].log_prefix
  when: (syslog_server | default('')) | length == 0
  register: syslog_remove
  failed_when: false

- name: reload system for timezone and syslog
  ansible.builtin.raw: /etc/init.d/system reload && /etc/init.d/log restart
  when: >-
    hostname_change.changed or tz_zone_change.changed or tz_change.changed
    or (syslog_change.changed | default(false))
    or (syslog_remove.changed | default(false))