---
- name: Remove existing wpad variant (mbedtls)
  action: community.openwrt.{{ openwrt_package_manager }}
  args:
    name: "{{ item }}"
    state: absent
  with_items:
  - "wpad-basic-mbedtls"
  - "wpad-mesh-wolfssl"

- name: Install fpackages
  action: community.openwrt.{{ openwrt_package_manager }}
  args:
    name: "{{ item }}"
    state: present
  with_items:
  - "luci-app-usteer"
  - "hostapd-utils"

- name: Install full wpad for 802.11r support
  action: community.openwrt.{{ openwrt_package_manager }}
  args:
    name: "{{ item }}"
    state: present
  with_items:
  - "wpad-mbedtls"
  register: wpad_install

- name: Trigger reboot
  ansible.builtin.raw: "nohup sh -c 'sleep 2 && reboot' >/dev/null 2>&1 &"
  when: wpad_install.changed

- name: Wait for the router to come back online
  openwrt_wait_for_connection:
    delay: 5        # Don't even try for the first 10 seconds
    timeout: 300       # Give up after 5 minutes
  when: wpad_install.changed

- name: Deploy usteer config
  community.openwrt.copy:
    src: usteer.j2
    dest: /etc/config/usteer
    mode: '0644'
  register: usteer_config_copy

- name: reload usteer
  ansible.builtin.raw: /etc/init.d/usteer reload
  when: usteer_config_copy.changed

- name: Configure Wi-Fi Interfaces (SSIDs)
  community.openwrt.uci:
    command: batch
    autocommit: true
    value: |
      set wireless.{{ item.device_name }}.type={{ wifi_common_iface.type }}
      set wireless.{{ item.device_name }}.phy={{ item.device_config.phy }}
      set wireless.{{ item.device_name }}.country={{ wifi_common_iface.country }}
      set wireless.{{ item.device_name }}.cell_density={{ wifi_common_iface.cell_density }}
      set wireless.{{ item.device_name }}.htmode={{ item.device_config.htmode }}
      set wireless.{{ item.device_name }}.band={{ item.device_config.band }}
      set wireless.{{ item.device_name }}.channel={{ item.device_config.channel }}
      set wireless.{{ item.device_name }}.disabled={{ wifi_common_iface.disabled }}
      {% if item.device_config.path is defined and item.device_config.path %}
      set wireless.{{ item.device_name }}.path={{ item.device_config.path }}
      {% endif %}

      set wireless.default_{{ item.device_name }}.device={{ item.device_name }}
      set wireless.default_{{ item.device_name }}.network={{ wifi_common_iface.network }}
      set wireless.default_{{ item.device_name }}.mode={{ wifi_common_iface.mode }}
      set wireless.default_{{ item.device_name }}.disabled=0
      set wireless.default_{{ item.device_name }}.ssid={{ wifi_common_iface.ssid }}
      set wireless.default_{{ item.device_name }}.encryption={{ wifi_common_iface.encryption }}
      set wireless.default_{{ item.device_name }}.key={{ wifi_common_iface.key }}
      set wireless.default_{{ item.device_name }}.ft_over_ds={{ wifi_common_iface.ft_over_ds }}
      set wireless.default_{{ item.device_name }}.ft_psk_generate_local={{ wifi_common_iface.ft_psk_generate_local }}
      set wireless.default_{{ item.device_name }}.ieee80211r={{ wifi_common_iface.ieee80211r }}
      set wireless.default_{{ item.device_name }}.ieee80211w={{ wifi_common_iface.ieee80211w }}
      set wireless.default_{{ item.device_name }}.mobility_domain={{ wifi_common_iface.mobility_domain }}
      set wireless.default_{{ item.device_name }}.nasid={{ inventory_hostname | hash('md5') | truncate(12, True, '') }}
      set wireless.default_{{ item.device_name }}.ieee80211k={{ wifi_common_iface.ieee80211k }}
      set wireless.default_{{ item.device_name }}.time_advertisement={{ wifi_common_iface.time_advertisement }}
      set wireless.default_{{ item.device_name }}.time_zone={{ wifi_common_iface.time_zone }}
      set wireless.default_{{ item.device_name }}.bss_transition={{ wifi_common_iface.bss_transition }}
      set wireless.default_{{ item.device_name }}.wnm_sleep_mode={{ wifi_common_iface.wnm_sleep_mode }}
      set wireless.default_{{ item.device_name }}.wnm_sleep_mode_no_keys={{ wifi_common_iface.wnm_sleep_mode_no_keys }}
      set wireless.default_{{ item.device_name }}.reassociation_deadline={{ wifi_common_iface.reassociation_deadline }}
      set wireless.default_{{ item.device_name }}.rrm_neighbor_report={{ wifi_common_iface.rrm_neighbor_report }}
      set wireless.default_{{ item.device_name }}.rrm_beacon_report={{ wifi_common_iface.rrm_beacon_report }}
      set wireless.default_{{ item.device_name }}.wmm={{ wifi_common_iface.wmm }}
  loop: "{{ wifi_settings | dict2items(key_name='device_name', value_name='device_config') }}"
  no_log: true
  register: uci_result

- name: Configure IoT Wi-Fi interfaces
  community.openwrt.uci:
    command: section
    config: wireless
    type: wifi-iface
    name: "iot_{{ item.key }}"
    autocommit: true
    value:
      device: "{{ item.key }}"
      mode: ap
      network: "{{ wifi_iot_iface.network }}"
      disabled: '0'
      ssid: "{{ wifi_iot_iface.ssid }}"
      encryption: "{{ wifi_iot_iface.encryption }}"
      key: "{{ wifi_iot_iface.key }}"
      isolate: "{{ wifi_iot_iface.isolate }}"
      ft_over_ds: "{{ wifi_iot_iface.ft_over_ds }}"
      ft_psk_generate_local: "{{ wifi_iot_iface.ft_psk_generate_local }}"
      ieee80211r: "{{ wifi_iot_iface.ieee80211r }}"
      ieee80211w: "{{ wifi_iot_iface.ieee80211w }}"
      mobility_domain: "{{ wifi_iot_iface.mobility_domain }}"
      nasid: "{{ inventory_hostname | hash('md5') | truncate(12, True, '') }}"
      ieee80211k: "{{ wifi_iot_iface.ieee80211k }}"
      time_advertisement: "{{ wifi_iot_iface.time_advertisement }}"
      time_zone: "{{ wifi_iot_iface.time_zone }}"
      bss_transition: "{{ wifi_iot_iface.bss_transition }}"
      wnm_sleep_mode: "{{ wifi_iot_iface.wnm_sleep_mode }}"
      wnm_sleep_mode_no_keys: "{{ wifi_iot_iface.wnm_sleep_mode_no_keys }}"
      reassociation_deadline: "{{ wifi_iot_iface.reassociation_deadline }}"
      rrm_neighbor_report: "{{ wifi_iot_iface.rrm_neighbor_report }}"
      rrm_beacon_report: "{{ wifi_iot_iface.rrm_beacon_report }}"
      wmm: "{{ wifi_iot_iface.wmm }}"
  loop: "{{ wifi_settings | dict2items }}"
  no_log: true
  register: iot_wifi_uci_result

- name: Configure unrestricted Wi-Fi interfaces
  community.openwrt.uci:
    command: section
    config: wireless
    type: wifi-iface
    name: "unrestricted_{{ item.key }}"
    autocommit: true
    value:
      device: "{{ item.key }}"
      mode: ap
      network: "{{ wifi_unrestricted_iface.network }}"
      disabled: '0'
      ssid: "{{ wifi_unrestricted_iface.ssid }}"
      encryption: "{{ wifi_unrestricted_iface.encryption }}"
      key: "{{ wifi_unrestricted_iface.key }}"
      isolate: "{{ '0' }}"
      ft_over_ds: "{{ wifi_unrestricted_iface.ft_over_ds }}"
      ft_psk_generate_local: "{{ wifi_unrestricted_iface.ft_psk_generate_local }}"
      ieee80211r: "{{ wifi_unrestricted_iface.ieee80211r }}"
      ieee80211w: "{{ wifi_unrestricted_iface.ieee80211w }}"
      mobility_domain: "{{ wifi_unrestricted_iface.mobility_domain }}"
      nasid: "{{ inventory_hostname | hash('md5') | truncate(12, True, '') }}"
      ieee80211k: "{{ wifi_unrestricted_iface.ieee80211k }}"
      time_advertisement: "{{ wifi_unrestricted_iface.time_advertisement }}"
      time_zone: "{{ wifi_unrestricted_iface.time_zone }}"
      bss_transition: "{{ wifi_unrestricted_iface.bss_transition }}"
      wnm_sleep_mode: "{{ wifi_unrestricted_iface.wnm_sleep_mode }}"
      wnm_sleep_mode_no_keys: "{{ wifi_unrestricted_iface.wnm_sleep_mode_no_keys }}"
      reassociation_deadline: "{{ wifi_unrestricted_iface.reassociation_deadline }}"
      rrm_neighbor_report: "{{ wifi_unrestricted_iface.rrm_neighbor_report }}"
      rrm_beacon_report: "{{ wifi_unrestricted_iface.rrm_beacon_report }}"
      wmm: "{{ wifi_unrestricted_iface.wmm }}"
  loop: "{{ wifi_settings | dict2items }}"
  no_log: true
  register: unrestricted_wifi_uci_result

- name: Reload wireless interface
  ansible.builtin.raw: wifi reload
  when: uci_result.changed or iot_wifi_uci_result.changed or unrestricted_wifi_uci_result.changed

- name: Check for radios stuck in setup failure
  ansible.builtin.raw: "wifi status | grep -c 'retry_setup_failed.: true' || true"
  register: wifi_stuck
  changed_when: false

- name: Restart wpad and reload wireless when radios are stuck
  ansible.builtin.raw: /etc/init.d/wpad restart && sleep 5 && wifi reload
  when: (wifi_stuck.stdout | trim | int) > 0
