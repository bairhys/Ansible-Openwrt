---
- import_playbook: reachability.yml

- name: Validate unrestricted network before any device changes
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate credentials and VLAN configuration
      ansible.builtin.import_role:
        name: unrestricted_network
        tasks_from: preflight.yml

- name: Back up and arm automatic network rollback
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  any_errors_fatal: true
  roles:
    - community.openwrt.init
    - network_rollback

- name: Initial Setup
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - initial_setup

- name: Setup iperf3 Server
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - iperf_server

- name: Change WAN DNS Settings
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - wan_dns

- name: Configure AP Networks
  hosts: openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - ap_network

- name: Configure IoT Network
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  any_errors_fatal: true

  roles:
    - community.openwrt.init
    - iot_network

- name: Configure unrestricted network on the router
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false
  any_errors_fatal: true
  roles:
    - community.openwrt.init
    - unrestricted_network

- name: Configure unrestricted network on access points
  hosts: openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles:
    - community.openwrt.init
    - unrestricted_network

- name: Setup Cake Autorate on WAN interface
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - cake_autorate

- name: Configure Wi-Fi
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  roles:
    - community.openwrt.init
    - wifi

- name: Setup DDNS
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - ddns

- name: Setup WireGuard VPN Server
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - wireguard

- name: Setup Tailscale Subnet Router
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - role: community.openwrt.init
      when: (tailscale_enabled | default(false)) | bool
    - role: tailscale
      when: (tailscale_enabled | default(false)) | bool

- name: Setup Prometheus Exporter
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - prometheus_exporter

- name: Setup Prometheus Exporter on APs
  hosts: openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - prometheus_exporter

- name: Report OpenWrt versions
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false

  tasks:
    - name: Read OpenWrt release
      ansible.builtin.raw: ". /etc/openwrt_release && echo \"$DISTRIB_DESCRIPTION ($DISTRIB_TARGET)\""
      register: openwrt_release
      changed_when: false

    - name: Show OpenWrt version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ openwrt_release.stdout | trim }}"

- name: Ensure all AP Wi-Fi SSIDs are enabled
  hosts: openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Enforce enabled AP wireless configuration
      ansible.builtin.include_role:
        name: wifi
        tasks_from: ensure_enabled.yml

- name: Verify network changes and cancel automatic rollback
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify management connection
      openwrt_wait_for_connection:
        timeout: 60
    - name: Verify new network and SSIDs
      ansible.builtin.import_role:
        name: unrestricted_network
        tasks_from: verify.yml
    - name: Cancel rollback only after verification
      ansible.builtin.import_role:
        name: network_rollback
        tasks_from: disarm.yml
