---
- import_playbook: reachability.yml

- name: Prepare AP gateway and DNS before OpenWrt package initialization
  hosts: openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  vars:
    main_router_address: "{{ hostvars[groups['openwrt_router'][0]].ansible_host }}"
  tasks:
    # Use raw commands: community.openwrt.init may itself need working DNS
    # and Internet routing to install its compatibility packages.
    - name: Point AP management gateway and DNS at the main router
      ansible.builtin.raw: |
        set -eu
        router={{ main_router_address | quote }}
        if [ "$(uci -q get network.lan.gateway || true)" = "$router" ] &&
           [ "$(uci -q get network.lan.dns || true)" = "$router" ]; then
          exit 0
        fi
        uci set network.lan.gateway="$router"
        uci -q delete network.lan.dns || true
        uci add_list network.lan.dns="$router"
        uci commit network
        /etc/init.d/network reload
        echo gateway_dns_updated
      register: ap_gateway_dns
      changed_when: "'gateway_dns_updated' in ap_gateway_dns.stdout"

    - name: Verify AP configured and active gateway and router DNS
      ansible.builtin.raw: |
        set -eu
        router={{ main_router_address | quote }}
        [ "$(uci -q get network.lan.gateway)" = "$router" ]
        [ "$(uci -q get network.lan.dns)" = "$router" ]
        ip -4 route get 1.1.1.1 | awk -v router="$router" '
          { for (i = 1; i < NF; i++) if ($i == "via" && $(i+1) == router) found = 1 }
          END { exit !found }'
        nslookup downloads.openwrt.org "$router"
      register: ap_gateway_dns_check
      changed_when: false
      retries: 6
      delay: 5
      until: ap_gateway_dns_check.rc == 0
      when: not ansible_check_mode

- name: Check routing and DNS before OpenWrt package initialization
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify an active IPv4 default route and system DNS resolution
      ansible.builtin.raw: |
        set -eu
        ip -4 route show default | awk 'END { exit (NR == 0) }'
        nslookup downloads.openwrt.org
      changed_when: false
      when: not ansible_check_mode

- name: Validate unrestricted network before any device changes
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Validate credentials and VLAN configuration
      ansible.builtin.import_role:
        name: unrestricted_network
        tasks_from: preflight.yml

- name: Back up and arm automatic network rollback
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  any_errors_fatal: true
  roles:
    - community.openwrt.init
    - network_rollback

- name: Initial Setup
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - initial_setup

- name: Setup iperf3 Server
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - iperf_server

- name: Change WAN DNS Settings
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - wan_dns

- name: Configure AP Networks
  hosts: openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - ap_network

- name: Configure IoT Network
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  any_errors_fatal: true

  roles:
    - community.openwrt.init
    - iot_network

- name: Configure unrestricted network on the router
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false
  any_errors_fatal: true
  roles:
    - community.openwrt.init
    - unrestricted_network

- name: Configure unrestricted network on access points
  hosts: openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles:
    - community.openwrt.init
    - unrestricted_network

- name: Setup Cake Autorate on WAN interface
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - cake_autorate

- name: Configure Wi-Fi
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  roles:
    - community.openwrt.init
    - wifi

- name: Setup DDNS
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - ddns

- name: Setup WireGuard VPN Server
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - wireguard

- name: Setup Tailscale Subnet Router
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - role: community.openwrt.init
      when: (tailscale_enabled | default(false)) | bool
    - role: tailscale
      when: (tailscale_enabled | default(false)) | bool

- name: Setup Prometheus Exporter
  hosts: openwrt_router:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - prometheus_exporter

- name: Setup Prometheus Exporter on APs
  hosts: openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false

  roles:
    - community.openwrt.init
    - prometheus_exporter

- name: Ensure all AP Wi-Fi SSIDs are enabled
  hosts: openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Enforce enabled AP wireless configuration
      ansible.builtin.include_role:
        name: wifi
        tasks_from: ensure_enabled.yml

- name: Verify network changes and cancel automatic rollback
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify management connection
      openwrt_wait_for_connection:
        timeout: 60
    - name: Verify new network and SSIDs
      ansible.builtin.import_role:
        name: unrestricted_network
        tasks_from: verify.yml
    - name: Cancel rollback only after verification
      ansible.builtin.import_role:
        name: network_rollback
        tasks_from: disarm.yml

- name: Report OpenWrt version and password status
  hosts: openwrt_router:openwrt_APs:&openwrt_playbook_accessible
  gather_facts: false

  tasks:
    - name: Read OpenWrt release
      ansible.builtin.raw: ". /etc/openwrt_release && echo \"$DISTRIB_DESCRIPTION ($DISTRIB_TARGET)\""
      register: openwrt_release
      changed_when: false

    - name: Show OpenWrt version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ openwrt_release.stdout | trim }}"

    - name: Check whether the root password is set
      ansible.builtin.raw: |
        awk -F: '
          $1 == "root" && $2 != "" && $2 !~ /^[!*]/ { found = 1 }
          END { exit !found }
        ' /etc/shadow
      register: openwrt_root_password
      changed_when: false
      failed_when: false

    - name: Warn if the root password is not set
      ansible.builtin.debug:
        msg: "WARNING: {{ inventory_hostname }} has no usable root password set. Set one on the OpenWrt device with passwd."
      when: openwrt_root_password.rc == 1

    - name: Warn if the root password could not be checked
      ansible.builtin.debug:
        msg: "WARNING: Could not check the root password on {{ inventory_hostname }}."
      when: openwrt_root_password.rc not in [0, 1]
